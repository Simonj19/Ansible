---
- name: Configure HTTPS for nginx
  hosts: webserver
  become: true
  tasks:
    - name: Copy HTTPS configuration
      ansible.builtin.copy:
        src: files/https.conf
        dest: /etc/nginx/conf.d/https.conf
        owner: root
        group: root
        mode: '0644'

    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

