# Denna playbook styr uppdelningen mellan webb och databasserver.
# Använder roller för att förenkla min playbook och få mer struktur.

- name: Configure the web server(s) according to specs
  become: true  #Root rättigheter
  hosts: webserver
  vars_files:
    - vars/users.yml
  roles:
    - webserver 

- name: Configure the database server(s) according to specs
  become: true
  hosts: dbserver
  vars_files:
    - secrets.yml
  roles:
    - dbserver 
